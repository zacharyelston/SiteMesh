[project]
name = "sitemesh"
version = "0.1.0"
description = "Phone photos + ARKit poses -> metric, georegistered mesh"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pycolmap==4.1.1",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sitemesh = "sitemesh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
